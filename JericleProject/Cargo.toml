[package]
name = "opendash"
version = "0.4.1"
edition = "2021"
description = "Pre-open US market news and price dashboard, served locally in the browser"

[[bin]]
name = "opendash"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "charset", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
toml = "0.8"

[profile.release]
opt-level = 2

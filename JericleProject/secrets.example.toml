# opendash API credentials — TEMPLATE. Copy to ~/.opendash/secrets.toml and fill in.
#
#   mkdir -p ~/.opendash
#   cp secrets.example.toml ~/.opendash/secrets.toml
#   chmod 600 ~/.opendash/secrets.toml
#
# Why it lives outside the repository: BA-Projects is a public GitHub repo. A key in
# a tracked file is a key anyone can clone, and an API key that leaks can be used
# to burn the account's quota or change its plan. The daemon reads this file at
# startup and warns if its mode is anything other than 600.
#
# One [providers.<name>] table per service. Adding a provider needs no code change.

[providers.twelvedata]
api_key = ""

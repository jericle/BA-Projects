# opendash configuration
#
# Every field below is also the built-in default, so delete anything you do not
# want to override. Times are Eastern Time unless stated otherwise.
#
# API keys are NOT here. They live in a secrets file outside the repo — this
# repository is public. See README.md, "API keys".

port = 8787
# "localhost" binds both 127.0.0.1 and [::1]. Safari resolves localhost to
# ::1 first, so an IPv4-only bind appears dead in the browser.
host = "localhost"
db_path = "data/dashboard.db"

# Refresh cadence. The hot window is the hour around the cash open, where the
# dashboard is actually being watched: 08:00-09:35 ET.
refresh_seconds = 120
refresh_seconds_hot = 30
hot_window_start = "08:00"
hot_window_end = "09:35"

top_news = 20
max_age_hours = 30
keep_days = 45

# Outbound politeness. Yahoo's public endpoints tolerate this easily.
max_concurrency = 4
request_spacing_ms = 150

# Market-wide Google News queries. ":1d" is automatically narrowed to ":6h" when
# the cash open is less than 6 hours away.
market_queries = [
    "stock market when:1d",
    "\"S&P 500\" when:1d",
    "premarket movers stocks when:1d",
    "stock market today when:1d",
]

# Watchlist groups. Panel order follows this order.
[[groups]]
name = "AI Core"
symbols = ["NVDA", "AMD", "AVGO", "TSM", "ARM", "MRVL", "INTC", "ORCL", "MSFT", "GOOGL"]

[[groups]]
name = "Memory & Storage"
symbols = ["MU", "WDC", "STX", "SNDK"]

[[groups]]
name = "Power & Grid"
symbols = ["CEG", "VST", "NRG", "TLN", "GEV", "ETN", "PWR", "EME"]

# Extra company names for ticker tagging, merged over the built-in table.
# [extra_aliases]
# SOMETHING = ["some company", "nickname"]

# Optional local LLM rerank of the top headlines. Off by default: the dashboard
# must never depend on this endpoint being up.
[llm]
enabled = false
url = "http://10.0.0.2:52415"
model = "mlx-community/Qwen3.6-35B-A3B-4bit"
timeout_ms = 5000

# Twelve Data, for the PRICE HISTORY tab. Tuning only — the key is in the
# secrets file, never here. This block is safe to commit.
[twelvedata]
enabled = true
base_url = "https://api.twelvedata.com"
# Intraday bars are only interesting for a minute or two, so the cache is short.
cache_seconds = 60
# Credits per minute, matched to the account's plan. The free Basic tier is 8 and
# 800/day; Grow is 55; Pro is 610. Raising this above the plan's real allowance
# does not buy speed, it earns HTTP 429s and eventually a suspended key.
rate_limit_per_minute = 8

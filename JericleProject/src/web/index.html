<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Open Dashboard</title>
<style>
  :root {
    --bg:        #1a1e24;
    --panel:     #21262d;
    --panel-2:   #272c34;
    --line:      #32383f;
    --text:      #e0e0e0;
    --muted:     #8b939c;
    --dim:       #6b737c;
    --accent:    #4fc3f7;
    --up:        #66bb6a;
    --down:      #ef5350;
    --warn:      #ffa726;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--accent); }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 12px 20px;
    background: linear-gradient(180deg, #1f242b, #1a1e24);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; }
  .brand span { color: var(--accent); }

  .badge {
    padding: 3px 9px; border-radius: 3px; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;
    border: 1px solid currentColor;
  }
  .badge.pre-market { color: var(--warn); }
  .badge.open       { color: var(--up); }
  .badge.after-hours{ color: var(--muted); }
  .badge.closed     { color: var(--dim); }
  .badge.early      { color: var(--dim); }

  /* ---------- split-flap countdown ---------- */
  .flaps { display: flex; align-items: center; gap: 4px; }
  .flap {
    position: relative; width: 30px; height: 42px; overflow: hidden;
    background: #2a2f36; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #3a4048, 0 1px 2px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; font-weight: 600; color: var(--text);
  }
  /* the seam down the middle of a real flap */
  .flap::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: rgba(0,0,0,0.55);
  }
  .flap.flip { animation: flip .26s ease-out; }
  @keyframes flip {
    0%   { transform: perspective(160px) rotateX(0deg);   filter: brightness(1); }
    50%  { transform: perspective(160px) rotateX(-42deg); filter: brightness(1.7); }
    100% { transform: perspective(160px) rotateX(0deg);   filter: brightness(1); }
  }
  .flap.blank { background: #1f242b; }
  .flap-label { font-size: 10px; color: var(--dim); letter-spacing: 0.1em; margin-right: 6px; }

  .clock { color: var(--muted); font-size: 12px; }
  .clock b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }

  button.ghost {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.ghost:disabled { opacity: .5; cursor: default; }

  /* ---------- trending chips ---------- */
  .trending { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .chip {
    font-size: 11px; padding: 2px 6px; border-radius: 3px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .chip.hit { color: var(--accent); border-color: #2f4b57; }

  /* ---------- layout ---------- */
  /* KPI cards occupy their own full-width band; this row is headlines + the
     right-hand panel underneath it. */
  main {
    display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 16px; padding: 16px 20px 40px; align-items: start;
  }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }
  .panel > h2 {
    margin: 0; padding: 9px 13px; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel > h2 .note { color: var(--dim); letter-spacing: 0.04em; text-transform: none; font-size: 11px; }

  /* ---------- news ---------- */
  .news { display: flex; flex-direction: column; }
  .item {
    display: grid; grid-template-columns: 26px 1fr; gap: 10px;
    padding: 10px 13px; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: var(--panel-2); }
  .rank { color: var(--dim); font-size: 12px; text-align: right; padding-top: 1px; }
  .headline { font-size: 13px; line-height: 1.45; }
  .meta { margin-top: 5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
  .src { color: var(--text); }
  .dot { color: var(--dim); }

  .scorebar {
    position: relative; height: 3px; margin-top: 7px; border-radius: 2px;
    background: var(--panel-2); overflow: hidden;
  }
  .scorebar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .55; }

  .tk {
    font-size: 10.5px; padding: 1px 5px; border-radius: 2px;
    background: #1d3b46; color: var(--accent); border: 1px solid #2a5563;
  }
  .sent { font-size: 10.5px; padding: 1px 5px; border-radius: 2px; font-weight: 600; }
  .sent.pos { background: #1e3325; color: var(--up); }
  .sent.neg { background: #3a1f1f; color: var(--down); }
  .sent.neu { background: var(--panel-2); color: var(--dim); }
  .outlets { color: var(--dim); font-size: 10.5px; }

  /* ---------- KPI cards ---------- */
  /* Four columns; each column stacks one KPI card on the option walls for that
     same symbol, so the walls always belong to the ticker directly above them. */
  .kpiwrap { padding: 16px 20px 0; }
  .stacks {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .kpi.full { grid-column: 1 / -1; }
  @media (max-width: 1180px) { .stacks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px)  { .stacks { grid-template-columns: 1fr; } }

  /* Compact option walls that sit under a single KPI card. */
  .walls {
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 11px 9px; flex: 1;
  }
  .walls-head {
    display: flex; justify-content: space-between; gap: 6px;
    font-size: 10px; color: var(--dim); margin-bottom: 6px;
  }
  .walls-head b { color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
  .wrow {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 3px 0;
  }
  .wrow + .wrow { border-top: 1px solid var(--line); }
  .wrow .k { font-size: 10px; color: var(--dim); letter-spacing: 0.08em; }
  .wrow .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .wrow .oi { font-size: 10px; margin: 0; }
  .walls-foot {
    margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line);
    font-size: 10px; color: var(--dim); display: flex; justify-content: space-between; gap: 6px;
  }
  .walls.pending .v, .walls.err .v { font-size: 11px; color: var(--dim); font-weight: 400; }
  .kpi {
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 10px 13px; position: relative; overflow: hidden;
  }
  .kpi::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--dim);
  }
  .kpi.up::before   { background: var(--up); }
  .kpi.down::before { background: var(--down); }
  .kpi.warm::before { background: var(--warn); }
  /* Labels render in the case they are written in, so "Highest Volume Buy" reads
     as written rather than being forced to caps. */
  .kpi-label {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--muted); display: flex; justify-content: space-between; gap: 8px;
  }
  .kpi-label .sub {
    color: var(--dim); font-size: 10.5px; font-weight: 400;
    letter-spacing: 0.04em;
  }
  .kpi-value {
    font-size: 21px; font-weight: 600; margin-top: 5px; line-height: 1.15;
    display: flex; align-items: baseline; gap: 8px;
  }
  .kpi-value .sym { font-size: 15px; color: var(--text); }
  .kpi-value .px { font-size: 12px; color: var(--muted); font-weight: 400; }
  .kpi-foot { margin-top: 4px; font-size: 10.5px; color: var(--dim); }
  .kpi.clickable { cursor: pointer; }
  .kpi.clickable:hover { border-color: var(--accent); }
  .kpi.loading .kpi-value { color: var(--dim); font-size: 13px; }
  .kpi .bar { height: 3px; border-radius: 2px; background: var(--panel-2); margin-top: 8px; overflow: hidden; }
  .kpi .bar > i { display: block; height: 100%; }
  .oi { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); margin-top: 2px; }

  /* ---------- prices ---------- */
  .group-title {
    padding: 7px 13px; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); background: #1b2027; border-bottom: 1px solid var(--line);
    border-top: 1px solid var(--line);
  }
  .group-title:first-child { border-top: none; }
  .row {
    display: grid; grid-template-columns: 62px 1fr 74px 66px;
    gap: 8px; align-items: center;
    padding: 6px 13px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover { background: var(--panel-2); }
  .row.sel { background: #1d2b33; box-shadow: inset 2px 0 0 var(--accent); }
  .sym { font-weight: 600; letter-spacing: 0.04em; }
  .sym small { display: block; color: var(--dim); font-weight: 400; font-size: 10px; letter-spacing: 0; }
  .px { text-align: right; font-variant-numeric: tabular-nums; }
  .px small { display: block; color: var(--dim); font-size: 10px; }
  .chg { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .up   { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }
  .spark { width: 100%; height: 26px; display: block; }
  .thin { color: var(--dim); font-size: 10px; padding: 6px 0; }
  .stale { color: var(--warn); }
  .stale-row { opacity: .72; }
  .nnews { text-align: right; color: var(--dim); font-size: 10.5px; }

  /* ---------- detail drawer ---------- */
  #scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: none;
  }
  #scrim.on { display: block; }
  #detail {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 94vw); z-index: 31;
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .18s ease-out;
    overflow-y: auto; display: none;
  }
  #detail.on { display: block; transform: translateX(0); }
  #detail header {
    position: sticky; top: 0; background: var(--panel); display: flex;
    align-items: center; gap: 12px; padding: 12px 16px;
  }
  .dbody { padding: 0 16px 30px; }
  .stat { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 0 14px; }
  .stat div { font-size: 11px; color: var(--dim); }
  .stat b { display: block; font-size: 15px; color: var(--text); font-weight: 600; }
  .chartbox { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .legend { display: flex; gap: 14px; color: var(--dim); font-size: 10.5px; padding: 7px 2px 0; }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; vertical-align: -1px; }
  h3.sec { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  ul.plain li:last-child { border-bottom: none; }

  footer { color: var(--dim); font-size: 11px; padding: 0 20px 26px; }
  .warn { color: var(--warn); }
  .empty { padding: 24px 13px; color: var(--dim); }
</style>
</head>
<body>

<header>
  <div class="brand">PRE<span>·</span>OPEN</div>
  <div id="phaseBadge"><span class="badge closed">…</span></div>
  <div class="flaps" id="countdown" title="time until the 09:30 ET cash open"></div>
  <div class="clock" id="clocks"></div>
  <div class="spacer"></div>
  <div class="trending" id="trending"></div>
  <button class="ghost" id="refreshBtn" title="refresh now (r)">refresh</button>
</header>

<div class="kpiwrap">
  <div class="stacks" id="kpiStacks"></div>
</div>

<main>
  <section class="panel">
    <h2><span>Top headlines</span><span class="note" id="newsNote"></span></h2>
    <div class="news" id="news"></div>
  </section>

  <section class="panel">
    <h2><span>Pre-market</span><span class="note" id="priceNote"></span></h2>
    <div id="prices"></div>
  </section>
</main>

<footer id="foot"></footer>

<div id="scrim"></div>
<aside id="detail"><header>
  <div class="brand" id="dTitle" style="font-size:16px">—</div>
  <div class="spacer"></div>
  <button class="ghost" id="dClose">close (esc)</button>
</header><div class="dbody" id="dBody"></div></aside>

<script>
"use strict";

// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const etFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
const etFullFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: "America/New_York", month: "short", day: "numeric",
  hour: "2-digit", minute: "2-digit", hour12: false });

const fmtAge = (m) => m < 1 ? "now" : m < 60 ? `${Math.round(m)}m` : m < 1440 ? `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ""}` : `${Math.floor(m / 1440)}d`;
const fmtPct = (v) => (v > 0 ? "+" : "") + v.toFixed(2) + "%";
const cls = (v) => v > 0.005 ? "up" : v < -0.005 ? "down" : "flat";
// Tolerant of a missing or non-finite field: one absent key from an upstream feed
// should degrade a single value, not throw and blank the whole card.
const money = (v) =>
  v == null || !isFinite(v) ? "—"
    : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sentClass = (s) => s > 0.12 ? "pos" : s < -0.12 ? "neg" : "neu";
const sentLabel = (s) => s > 0.12 ? "BULLISH" : s < -0.12 ? "BEARISH" : "MIXED";

let DATA = null;
let selected = null;
let countdown = 0;
let busy = false;

// ---------------------------------------------------------------- sparkline
function sparkline(points, w = 100, h = 26) {
  if (!points || points.length < 2) return "";
  const ys = points.map(p => p.p);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) { hi += 0.01; lo -= 0.01; }
  const pad = 2;
  const sx = (i) => (i / (points.length - 1)) * w;
  const sy = (p) => h - pad - ((p - lo) / (hi - lo)) * (h - pad * 2);
  const d = points.map((p, i) => `${i ? "L" : "M"}${sx(i).toFixed(2)},${sy(p.p).toFixed(2)}`).join(" ");
  const up = points[points.length - 1].p >= points[0].p;
  const color = up ? "var(--up)" : "var(--down)";
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d} L${w},${h} L0,${h} Z" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4"
          vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// ---------------------------------------------------------------- countdown
let lastFlapChars = "";

function drawCountdown() {
  const total = Math.max(0, countdown);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const text = h > 0
    ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`
    : `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;

  if (text === lastFlapChars) return;
  const prev = lastFlapChars;
  lastFlapChars = text;

  const tiles = text.split("").map((c) =>
    c === ":"
      ? `<div class="flap blank"></div>`
      : `<div class="flap">${c}</div>`).join("");
  $("countdown").innerHTML = `<span class="flap-label">T-minus open</span>${tiles}`;

  // Flip only the tiles whose character actually changed.
  if (prev) {
    const now = [...$("countdown").querySelectorAll(".flap")];
    const before = prev.split("");
    now.forEach((tile, i) => {
      const c = text[i];
      if (c && c !== ":" && before[i] !== undefined && before[i] !== c) {
        tile.classList.add("flip");
      }
    });
  }
}

// ---------------------------------------------------------------- news
function renderNews() {
  const host = $("news");
  const items = DATA.news || [];
  $("newsNote").textContent =
    `${items.length} of ${DATA.allNewsCount} stories · ${(DATA.newsQueries || []).length} market feeds`;

  if (!items.length) {
    host.innerHTML = `<div class="empty">No headlines captured yet. The first refresh runs on load.</div>`;
    return;
  }

  host.innerHTML = items.map((n, i) => {
    const b = n.breakdown || {};
    const tip = [
      `salience ${n.salience.toFixed(1)}`,
      `recency ${(b.recency ?? 0).toFixed(1)}/30`,
      `cluster ${(b.cluster ?? 0).toFixed(1)}/25 (${b.clusterSize ?? 1} article(s), ${(b.outlets || []).length} outlet(s))`,
      `impact ${(b.impact ?? 0).toFixed(1)}/25${(b.impactHits || []).length ? " [" + b.impactHits.join(", ") + "]" : ""}`,
      `source ${(b.source ?? 0).toFixed(1)}/10 (${esc(n.source)})`,
      `watchlist ${(b.watchlist ?? 0).toFixed(1)}/10`,
    ].join("\n");
    const tickers = (n.tickers || []).map(t =>
      `<span class="tk">${esc(t)}</span>`).join(" ");
    const extra = (b.outlets || []).length > 1
      ? `<span class="outlets">+${b.outlets.length - 1} more outlet${b.outlets.length > 2 ? "s" : ""}</span>`
      : "";
    return `<article class="item" title="${esc(tip)}">
      <div class="rank">${i + 1}</div>
      <div>
        <a class="headline" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
        <div class="meta">
          <span class="src">${esc(n.source)}</span><span class="dot">·</span>
          <span>${fmtAge(n.ageMinutes)}</span><span class="dot">·</span>
          <span>${esc(n.publishedEt)}</span><span class="dot">·</span>
          <span class="sent ${sentClass(n.sentiment)}">${sentLabel(n.sentiment)}</span>
          ${tickers}
          ${extra}
          <span class="spacer"></span>
          <span class="outlets">${n.salience.toFixed(0)}</span>
        </div>
        <div class="scorebar"><i style="width:${Math.max(2, n.salience)}%"></i></div>
      </div>
    </article>`;
  }).join("");
}

// ---------------------------------------------------------------- KPI cards
// Today's move: the pre-market gap when one exists (that is the whole day's move
// before 09:30 ET), otherwise the last regular-session change.
const movePct = (q) => (q.gapPct != null ? q.gapPct : q.changePct);
const compact = (n) => {
  if (n == null || !isFinite(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(Math.round(n));
};
// Yahoo publishes no pre-market volume, so before the open the honest measure is
// the last completed session's volume, with the pre-market print count as the
// "today" signal. Once the cash session runs, real volume is used.
const volOf = (q) => (q.volume > 0 ? q.volume : (q.regularVolume ?? 0));
const volSub = () => (DATA.phase.phase === "pre-market" ? "last sess" : "session");
const volFoot = (q) =>
  q.volume > 0
    ? q.group
    : `${q.group} · ${q.premarketPrints ?? 0} pre-mkt prints`;

function kpiCard({ label, sub, symbol, px, value, valueClass, foot, tone, onclick, bar, title, span }) {
  return `<div class="kpi ${tone || ""} ${span || ""} ${onclick ? "clickable" : ""}"
      ${onclick ? `data-kpi="${esc(symbol)}"` : ""} title="${esc(title || label)}">
    <div class="kpi-label"><span>${esc(label)}</span><span class="sub">${esc(sub || "")}</span></div>
    <div class="kpi-value">
      ${symbol ? `<span class="sym">${esc(symbol)}</span>` : ""}
      <span class="${valueClass || ""}">${value}</span>
      ${px != null ? `<span class="px">${px}</span>` : ""}
    </div>
    ${foot ? `<div class="kpi-foot">${foot}</div>` : ""}
    ${bar != null ? `<div class="bar"><i style="width:${Math.max(2, Math.min(100, bar))}%;background:var(--${barTone(bar)})"></i></div>` : ""}
  </div>`;
}
const barTone = (v) => (v >= 0 ? "up" : "down");

// High Volume Buy / Sell are directional, not "high volume" and "low volume":
// HVB is the heaviest-traded name among those that are UP, HVS the heaviest-traded
// name among those that are DOWN. Direction comes from the pre-market gap before the
// open and the last change afterwards, the same measure the gainer/loser cards use.
const isUp = (q) => movePct(q) > 0.005;
const isDown = (q) => movePct(q) < -0.005;

function renderKpis() {
  const qs = (DATA.watchlist || []).filter(q => !q.error || q.last > 0);
  const host = $("kpiStacks");

  if (!qs.length) {
    host.innerHTML = `<div class="kpi loading full"><div class="kpi-label">Session</div>
      <div class="kpi-value">waiting for the first refresh…</div></div>`;
    return;
  }

  const byMoveDesc = [...qs].sort((a, b) => movePct(b) - movePct(a));
  const gainer = byMoveDesc[0];
  const loser = byMoveDesc[byMoveDesc.length - 1];

  // Heaviest volume among the up names, and among the down names.
  const heaviest = (list) =>
    list.length ? list.reduce((a, b) => (volOf(b) > volOf(a) ? b : a)) : null;
  const hvb = heaviest(qs.filter(isUp));
  const hvs = heaviest(qs.filter(isDown));

  // Bars are scaled to the busiest name on the watchlist so the two volume cards
  // are directly comparable with each other.
  const topVol = Math.max(...qs.map(volOf)) || 1;
  const measure = DATA.phase.phase === "pre-market" ? "gap" : "chg";

  // `tip` is a thunk, not a string: when nothing moved that way `q` is null and an
  // eagerly-built tooltip would dereference it before the empty state could render.
  const volCard = (label, sub, q, dir, tip) => {
    if (!q) {
      return `<div class="kpi">
        <div class="kpi-label"><span>${esc(label)}</span><span class="sub">${esc(sub)}</span></div>
        <div class="kpi-value" style="font-size:12px;color:var(--dim)">None ${dir} today</div>
      </div>`;
    }
    return kpiCard({
      label, sub, symbol: q.symbol, px: money(q.last), value: compact(volOf(q)),
      valueClass: dir === "up" ? "up" : "down",
      foot: `${volFoot(q)} · ${fmtPct(movePct(q))}`,
      tone: dir === "up" ? "up" : "down",
      bar: (volOf(q) / topVol) * 100, onclick: true, title: tip(q),
    });
  };

  // Each column pairs one session extreme with the option walls for that same
  // symbol, so the walls always belong to the ticker directly above them.
  const cards = [
    volCard("Highest Volume Buy", "vol · up", hvb, "up", (q) =>
      `Heaviest traded of the ${qs.filter(isUp).length} name(s) up on the watchlist, ` +
      `measured by ${volSub()} volume. Move ${fmtPct(movePct(q))}.`),
    volCard("Highest Volume Sell", "vol · down", hvs, "down", (q) =>
      `Heaviest traded of the ${qs.filter(isDown).length} name(s) down on the watchlist, ` +
      `measured by ${volSub()} volume. Move ${fmtPct(movePct(q))}.`),
    kpiCard({ label: "Top Gainer", sub: measure, symbol: gainer.symbol,
      px: money(gainer.last), value: fmtPct(movePct(gainer)), valueClass: cls(movePct(gainer)),
      foot: gainer.group, onclick: true }),
    kpiCard({ label: "Top Loser", sub: measure, symbol: loser.symbol,
      px: money(loser.last), value: fmtPct(movePct(loser)), valueClass: cls(movePct(loser)),
      foot: loser.group, onclick: true }),
  ];
  // Each column keeps its own symbol so the walls always sit under their own card,
  // even when a card is empty. The fetch list is deduplicated separately: the same
  // symbol can legitimately win more than one card and only needs loading once.
  const colSyms = [hvb, hvs, gainer, loser].map((q) => (q ? q.symbol : null));
  const symbols = [...new Set(colSyms.filter(Boolean))];

  wallsToken += 1;
  const token = wallsToken;
  host.innerHTML = cards.map((c, i) =>
    `<div class="stack" data-stack="${esc(colSyms[i] || "")}">${c}${wallsBlock(colSyms[i])}</div>`
  ).join("");

  host.querySelectorAll("[data-kpi]").forEach(el =>
    el.addEventListener("click", () => openDetail(el.dataset.kpi)));

  loadWalls(symbols, token);
}

// ---------------------------------------------------------------- option walls
let wallsToken = 0;

// CSS.escape is standard in browsers but absent in some non-browser runtimes, so
// fall back to escaping just the characters that matter inside a quoted selector.
const cssEsc = (v) =>
  typeof CSS !== "undefined" && CSS.escape
    ? CSS.escape(v)
    : String(v).replace(/["\\]/g, "\\$&");

function wallsBlock(sym) {
  if (!sym) {
    return `<div class="walls">
      <div class="walls-head"><b>OPTION WALLS</b><span>—</span></div>
      <div class="wrow"><span class="k">CALL</span><span class="v">no symbol</span></div>
      <div class="wrow"><span class="k">PUT</span><span class="v">—</span></div>
    </div>`;
  }
  return `<div class="walls pending" data-walls="${esc(sym)}">
    <div class="walls-head"><b>OPTION WALLS</b><span>${esc(sym)}</span></div>
    <div class="wrow"><span class="k">CALL</span><span class="v">loading…</span></div>
    <div class="wrow"><span class="k">PUT</span><span class="v">loading…</span></div>
  </div>`;
}

/// Fetch and paint the walls for every column. Results land by symbol, not by
/// position, so a slow response cannot end up in the wrong column.
async function loadWalls(symbols, token) {
  await Promise.all(symbols.map(async (sym) => {
    let d;
    try {
      const res = await fetch(`/api/options/${encodeURIComponent(sym)}`, { cache: "no-store" });
      d = await res.json();
    } catch (e) {
      d = { ok: false, error: String(e) };
    }
    // A response that arrives after a re-render belongs to a layout that is gone.
    if (token !== wallsToken) return;
    const host = document.querySelector(`[data-walls="${cssEsc(sym)}"]`);
    if (host) host.outerHTML = wallsResult(sym, d);
  }));
}

function wallsResult(sym, d) {
  if (!d.ok) {
    return `<div class="walls err" data-walls="${esc(sym)}">
      <div class="walls-head"><b>OPTION WALLS</b><span>${esc(sym)}</span></div>
      <div class="wrow"><span class="k">CALL</span><span class="v">unavailable</span></div>
      <div class="wrow"><span class="k">PUT</span><span class="v">${esc((d.error || "error").slice(0, 90))}</span></div>
    </div>`;
  }

  const dist = (v) => (v == null ? "" : `${v > 0 ? "+" : ""}${v.toFixed(1)}%`);
  const pcr = d.putCallRatio == null ? "—" : d.putCallRatio.toFixed(2);
  const monthTag = d.expiryIsCurrentMonth ? "current month" : "nearest expiry";
  const row = (k, wall, distPct, oi, color) => `
    <div class="wrow">
      <span class="k">${k}</span>
      <span class="v" style="color:var(--${color})">$${money(wall)}</span>
      <span class="oi">${esc(dist(distPct))} · OI ${compact(oi)}</span>
    </div>`;

  return `<div class="walls" data-walls="${esc(sym)}">
    <div class="walls-head"><b>OPTION WALLS</b><span>exp ${esc(d.expiry)}</span></div>
    ${row("CALL", d.callWall, d.callWallDistancePct, d.callWallOi, "down")}
    ${row("PUT", d.putWall, d.putWallDistancePct, d.putWallOi, "up")}
    <div class="walls-foot">
      <span title="${esc(monthTag)}">${esc(monthTag)}</span>
      <span>pc ${esc(pcr)}</span>
      <span>$${money(d.spot)}</span>
    </div>
  </div>`;
}

// ---------------------------------------------------------------- prices
function renderPrices() {
  const host = $("prices");
  const quotes = DATA.watchlist || [];
  const withGaps = quotes.filter(q => q.gapPct != null).length;
  $("priceNote").textContent = withGaps
    ? `${withGaps}/${quotes.length} with pre-market gaps`
    : `${quotes.length} symbols`;

  if (!quotes.length) {
    host.innerHTML = `<div class="empty">No quotes yet.</div>`;
    return;
  }

  const byGroup = new Map();
  for (const q of quotes) {
    if (!byGroup.has(q.group)) byGroup.set(q.group, []);
    byGroup.get(q.group).push(q);
  }

  let html = "";
  for (const [group, rows] of byGroup) {
    html += `<div class="group-title">${esc(group)}</div>`;
    for (const q of rows) {
      const gap = q.gapPct;
      const isSel = selected === q.symbol ? " sel" : "";
      const pts = q.spark || [];
      // Yahoo only emits 1-minute pre-market bars where a trade printed, so thin
      // names legitimately have one or two points. Say so rather than draw a lie.
      const chart = pts.length >= 3
        ? sparkline(pts)
        : `<div class="thin">${pts.length ? "thin pre-market" : "no pre-market"}</div>`;
      const newsBits = q.newsCount
        ? `${q.newsCount} news<br><span class="${sentClass(q.sentimentAvg)}">${sentLabel(q.sentimentAvg)}</span>`
        : `<span style="color:var(--dim)">no news</span>`;
      const stale = q.error ? `<small class="stale">stale</small>` : "";
      html += `<div class="row${isSel}${q.error ? " stale-row" : ""}" data-sym="${esc(q.symbol)}"
        title="${esc(q.name)}${q.error ? " — " + esc(q.error) : ""}">
        <div class="sym">${esc(q.symbol)}${q.premarket ? "" : "<small>regular</small>"}${stale}</div>
        <div>${chart}</div>
        <div class="px">${q.last > 0 ? money(q.last) : "—"}<small>prev ${q.priorClose > 0 ? money(q.priorClose) : "—"}</small></div>
        <div>
          <div class="chg ${gap == null ? "flat" : cls(gap)}">${gap == null ? "—" : fmtPct(gap)}</div>
          <div class="nnews">${newsBits}</div>
        </div>
      </div>`;
    }
  }
  host.innerHTML = html;

  host.querySelectorAll(".row").forEach(el =>
    el.addEventListener("click", () => openDetail(el.dataset.sym)));
}

// ---------------------------------------------------------------- detail
function openDetail(sym) {
  const q = (DATA.watchlist || []).find(x => x.symbol === sym);
  if (!q) return;
  selected = sym;
  renderPrices();

  $("dTitle").textContent = `${q.symbol}  ·  ${q.name}`;
  const gap = q.gapPct;
  const stat = (label, value, klass) =>
    `<div>${label}<b class="${klass || ""}">${value}</b></div>`;

  const pts = q.spark || [];
  let chart = `<div class="empty">No price history for this session.</div>`;
  if (pts.length >= 2) {
    const W = 700, H = 240, L = 8, R = 54, T = 10, B = 22;
    const news = (DATA.news || []).filter(n => (n.tickers || []).includes(sym));
    const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    const span = Math.max(1, t1 - t0);
    const ys = pts.map(p => p.p);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    const padY = (hi - lo) * 0.12 || Math.max(hi * 0.004, 0.02);
    lo -= padY; hi += padY;
    const X = (t) => L + ((t - t0) / span) * (W - L - R);
    const Y = (p) => T + (1 - (p - lo) / (hi - lo)) * (H - T - B);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.p).toFixed(1)}`).join(" ");
    const up = pts[pts.length - 1].p >= pts[0].p;
    const color = up ? "var(--up)" : "var(--down)";

    // Prior close reference line.
    const pcY = Y(q.priorClose);
    const pcLine = q.priorClose >= lo && q.priorClose <= hi
      ? `<line x1="${L}" y1="${pcY.toFixed(1)}" x2="${W - R}" y2="${pcY.toFixed(1)}"
           stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>
         <text x="${W - R + 5}" y="${(pcY + 3).toFixed(1)}" fill="var(--muted)"
           font-size="10">prev ${money(q.priorClose)}</text>` : "";

    const gridY = [0.25, 0.5, 0.75].map(f => {
      const p = lo + (hi - lo) * f, y = Y(p);
      return `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}"
                stroke="var(--line)" stroke-width="1" opacity=".7"/>
              <text x="${W - R + 5}" y="${(y + 3).toFixed(1)}" fill="var(--dim)"
                font-size="10">${money(p)}</text>`;
    }).join("");

    const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const t = t0 + span * f, x = X(t);
      return `<text x="${x.toFixed(1)}" y="${H - 6}" fill="var(--dim)" font-size="10"
                text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}">${etFmt.format(new Date(t * 1000))}</text>`;
    }).join("");

    const markers = news.map(n => {
      const t = Math.min(Math.max(n.publishedTs, t0), t1);
      const x = X(t);
      // Interpolate the price at the headline time for the dot.
      let p = pts[0].p;
      for (let i = 1; i < pts.length; i++) {
        if (pts[i].t >= t) {
          const f = (t - pts[i - 1].t) / Math.max(1, pts[i].t - pts[i - 1].t);
          p = pts[i - 1].p + (pts[i].p - pts[i - 1].p) * Math.min(1, Math.max(0, f));
          break;
        }
      }
      const y = Y(p);
      const c = n.sentiment > 0.12 ? "var(--up)" : n.sentiment < -0.12 ? "var(--down)" : "var(--muted)";
      return `<line x1="${x.toFixed(1)}" y1="${T}" x2="${x.toFixed(1)}" y2="${H - B}"
                stroke="${c}" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>
              <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${c}"
                stroke="var(--panel-2)" stroke-width="1.5">
                <title>${esc(etFullFmt.format(new Date(n.publishedTs * 1000)))} ET — ${esc(n.title)}</title>
              </circle>`;
    }).join("");

    chart = `<div class="chartbox">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        ${gridY}${pcLine}${ticks}
        <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8"/>
        <circle cx="${X(pts[pts.length - 1].t).toFixed(1)}" cy="${Y(pts[pts.length - 1].p).toFixed(1)}"
                r="3.5" fill="${color}"/>
        ${markers}
      </svg>
      <div class="legend">
        <span><i style="background:var(--up)"></i>bullish headline</span>
        <span><i style="background:var(--down)"></i>bearish headline</span>
        <span><i style="background:var(--muted)"></i>prior close</span>
      </div>
    </div>`;
  }

  const news = (DATA.news || []).filter(n => (n.tickers || []).includes(sym));
  const newsHtml = news.length
    ? `<ul class="plain">${news.map(n => `<li>
        <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
        <div class="meta">
          <span class="src">${esc(n.source)}</span><span class="dot">·</span>
          <span>${fmtAge(n.ageMinutes)} ago</span><span class="dot">·</span>
          <span class="sent ${sentClass(n.sentiment)}">${sentLabel(n.sentiment)}</span>
        </div></li>`).join("")}</ul>`
    : `<div class="empty">No tagged headlines for ${esc(sym)} in the current top ${DATA.news.length}.</div>`;

  $("dBody").innerHTML = `
    <div class="stat">
      ${stat("last", q.last > 0 ? money(q.last) : "—")}
      ${stat("gap vs prev close", gap == null ? "—" : fmtPct(gap), gap == null ? "" : cls(gap))}
      ${stat("day change", fmtPct(q.changePct), cls(q.changePct))}
      ${stat("pre-market VWAP", q.premarketVwap ? money(q.premarketVwap) : "—")}
      ${stat("pre-market range", q.premarketLow ? `${money(q.premarketLow)} – ${money(q.premarketHigh)}` : "—")}
      ${stat("session", q.sessionDate)}
    </div>
    <h3 class="sec">Pre-market price and headline timing</h3>
    ${chart}
    <h3 class="sec">Headlines for ${esc(sym)} (${news.length})</h3>
    ${newsHtml}`;

  $("detail").classList.add("on");
  $("scrim").classList.add("on");
}

function closeDetail() {
  $("detail").classList.remove("on");
  $("scrim").classList.remove("on");
  selected = null;
  renderPrices();
}

// ---------------------------------------------------------------- chrome
function renderChrome() {
  const p = DATA.phase;
  $("phaseBadge").innerHTML = `<span class="badge ${esc(p.phase)}">${esc(p.phase)}</span>`;
  $("clocks").innerHTML =
    `ET <b>${esc(p.etNow)}</b> &nbsp;|&nbsp; local <b>${esc(p.localNow)}</b>` +
    (p.isTradingDay ? "" : ` &nbsp;<span style="color:var(--dim)">(not a trading day)</span>`);
  countdown = p.countdownSeconds || 0;
  drawCountdown();

  $("trending").innerHTML = (DATA.trending || []).length
    ? `<span class="outlets">trending</span>` +
      DATA.trending.slice(0, 8).map(s =>
        `<span class="chip ${(DATA.watchlist || []).some(q => q.symbol === s) ? "hit" : ""}">${esc(s)}</span>`).join("")
    : "";

  const w = (DATA.warnings || []);
  $("foot").innerHTML =
    `session ${esc(p.phase)} · next open ${esc(p.marketOpenEt)} · ` +
    `generated ${esc(DATA.generatedEt)} (${esc(DATA.generatedLocal)}) · ` +
    `data age ${DATA.snapshotAgeSeconds ?? "?"}s · press r to refresh` +
    (w.length ? `<div class="warn">warnings: ${w.map(esc).join(" · ")}</div>` : "");
}

// ---------------------------------------------------------------- polling
async function load(manual) {
  if (busy) return;
  busy = true;
  const btn = $("refreshBtn");
  btn.disabled = true;
  try {
    const res = await fetch(manual ? "/api/refresh" : "/api/dashboard", { cache: "no-store" });
    let json;
    if (manual) {
      // /api/refresh returns a small ack; the real payload follows.
      await res.json();
      json = await (await fetch("/api/dashboard", { cache: "no-store" })).json();
    } else {
      json = await res.json();
    }
    DATA = json;
    renderChrome();
    renderNews();
    renderPrices();
    renderKpis();
    if (selected) {
      // keep the open drawer in sync with fresh data
      const keep = selected;
      $("detail").classList.remove("on");
      openDetail(keep);
    }
  } catch (e) {
    $("foot").innerHTML = `<span class="warn">could not reach the server: ${esc(e)}</span>`;
  } finally {
    busy = false;
    btn.disabled = false;
  }
}

$("refreshBtn").addEventListener("click", () => load(true));
$("dClose").addEventListener("click", closeDetail);
$("scrim").addEventListener("click", closeDetail);
document.addEventListener("keydown", (e) => {
  if (e.key === "r" && !e.metaKey && !e.ctrlKey) load(true);
  if (e.key === "Escape") closeDetail();
});

setInterval(() => {
  if (countdown > 0) { countdown -= 1; drawCountdown(); }
}, 1000);
setInterval(() => load(false), 30000);

load(false);
</script>
</body>
</html>
